[project]
name = "voice-recorder"
version = "0.1.0"
description = "App local (Windows) que detecta calls pelo uso do microfone, grava mic+loopback em trilhas separadas e transcreve via API da OpenAI."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
