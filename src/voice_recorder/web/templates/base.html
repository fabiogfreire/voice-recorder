<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Voice Recorder{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">Gravações</a>
        <a href="/settings">Configurações</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        // Auto-refresh página a cada 3s se houver gravação em andamento
        // (status "recording"). Sem refresh, a UI não mostra gravações
        // ativas em tempo real até terminar.
        function checkForActiveRecording() {
            const statusCells = document.querySelectorAll('td:nth-child(4)');
            for (const cell of statusCells) {
                if (cell.textContent.includes('recording')) {
                    setTimeout(() => location.reload(), 3000);
                    return;
                }
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkForActiveRecording);
        } else {
            checkForActiveRecording();
        }
    </script>
</body>
</html>
